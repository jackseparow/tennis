<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PadeLion Tennis Tournament Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SortableJS untuk Drag and Drop yang mulus -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header / Banner Putih khusus untuk Logo PadeLion -->
        <header class="flex items-center justify-center space-x-4 mb-8 bg-white p-6 rounded-2xl border border-slate-200 shadow-xl">
            <img src="logo padelion.png" alt="Logo PadeLion" class="h-20 sm:h-24 w-auto object-contain drop-shadow-md" onerror="this.style.display='none'">
            <div class="text-left">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">PadeLion Tennis Tournament Pro</h1>
                <p class="text-slate-600 text-xs sm:text-sm mt-1">Advanced Round Robin, Group Pools, Knockout & Custom Scoring</p>
            </div>
        </header>

        <!-- TAHAP 1: SETUP TURNAMEN -->
        <div id="setup-section" class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 mb-6">
            <h2 class="text-xl font-semibold mb-4 text-emerald-300">1. Konfigurasi Turnamen & Grup</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Daftar Pemain/Tim (Pisahkan dengan Enter)</label>
                    <textarea id="input-players" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 mb-3" placeholder="Tim Alpha&#10;Tim Bravo&#10;Tim Charlie&#10;Tim Delta&#10;Tim Echo&#10;Tim Foxtrot">Tim Alpha
Tim Bravo
Tim Charlie
Tim Delta
Tim Echo
Tim Foxtrot</textarea>
                    <button onclick="generateTeamChips()" class="w-full bg-slate-700 hover:bg-slate-600 text-emerald-300 text-xs font-semibold py-2 rounded-xl transition border border-slate-600">
                        Muat Tim ke Kotak Drag & Drop 🔄
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Metode Pembagian Pool</label>
                        <select id="input-assignment-method" onchange="toggleAssignmentUI()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
                            <option value="auto">Acak Otomatis oleh Aplikasi (Shuffle)</option>
                            <option value="manual" selected>Seret Manual ke Pool (Drag & Drop)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Jumlah Pool / Grup</label>
                        <select id="input-pools" onchange="renderManualPoolBoxes()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
                            <option value="1">1 Grup (Single Pool)</option>
                            <option value="2" selected>2 Grup (Pool A & Pool B)</option>
                            <option value="3">3 Grup (Pool A, B, C)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Sistem Penilaian Klasemen</label>
                        <select id="input-scoring-system" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
                            <option value="match-wins">Poin dari Kemenangan Match/Set (Standar)</option>
                            <option value="game-diff" selected>Berbasis Selisih Game (Game Won - Lost)</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Max Set</label>
                            <select id="input-sets" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm focus:outline-none focus:border-emerald-500">
                                <option value="1">1 Set</option>
                                <option value="3" selected>Best of 3</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Game per Set</label>
                            <input type="number" id="input-games" value="6" min="1" max="10" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                </div>
            </div>

            <!-- KOTAK DRAG & DROP MANUAL POOL -->
            <div id="manual-pool-section" class="mb-6 p-4 bg-slate-900/80 rounded-2xl border border-slate-700">
                <h3 class="text-sm font-bold text-emerald-400 mb-2">Area Seret Tim (Drag & Drop ke Pool)</h3>
                <p class="text-xs text-slate-400 mb-4">Seret nama tim dari daftar sumber ke kotak Pool masing-masing.</p>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Sumber Chip Tim -->
                    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                        <span class="text-xs font-bold text-slate-300 block mb-2 uppercase tracking-wider">Daftar Tim Tersedia</span>
                        <div id="unsorted-chips" class="flex flex-wrap gap-2 min-h-[100px] p-2 bg-slate-900 rounded-lg border border-dashed border-slate-700">
                            <!-- Diisi via JS -->
                        </div>
                    </div>
                    <!-- Wadah Pool Container (Dinamis) -->
                    <div id="manual-pools-container" class="md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <!-- Diisi via JS -->
                    </div>
                </div>
            </div>

            <button onclick="initTournament()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30">
                Generate Jadwal & Bagan Knockout 🚀
            </button>
        </div>

        <!-- TAHAP 2: DASHBOARD UTAMA -->
        <div id="dashboard-section" class="hidden space-y-6">
            
            <!-- Tab Navigation -->
            <div class="flex flex-wrap gap-2 border-b border-slate-700 pb-2">
                <button onclick="switchTab('matches')" id="btn-tab-matches" class="px-4 py-2 rounded-lg font-semibold text-sm bg-emerald-600 text-white transition">Jadwal Pertandingan</button>
                <button onclick="switchTab('standings')" id="btn-tab-standings" class="px-4 py-2 rounded-lg font-semibold text-sm bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Klasemen Grup</button>
                <button onclick="switchTab('knockout')" id="btn-tab-knockout" class="px-4 py-2 rounded-lg font-semibold text-sm bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Bagan Knockout (Semifinal/Final)</button>
                <button onclick="resetTournament()" class="ml-auto px-4 py-2 rounded-lg font-semibold text-sm bg-rose-900/40 text-rose-300 hover:bg-rose-900/60 transition">Reset Turnamen</button>
